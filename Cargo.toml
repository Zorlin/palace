[package]
name = "palace"
version = "0.1.0"
edition = "2021"
description = "Gamepad-native AI-assisted coding TUI"
license = "AGPL-3.0"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Database
redb = "2"

# Gamepad
gilrs = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# HTTP client (for API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# JSON
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async channels
futures = "0.3"

# Directory paths
dirs = "6"

# Environment
dotenvy = "0.15"

# Find executables
which = "7"

[dev-dependencies]
tempfile = "3"
