[workspace]
members = [".", "crates/anthropic-ffi"]

[package]
name = "palace"
version = "0.1.0"
edition = "2021"
description = "GPU-native recursive hierarchical self-improvement environment"
license = "MIT"
authors = ["Palace Contributors"]

[lib]
name = "palace"
path = "src/lib.rs"

[dependencies]
# GPU / Rendering
wgpu = "28"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Input
gilrs = "0.11"

# Parsing
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Filesystem
dirs = "6"

# Embedded database for persistence
redb = "3.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Text rendering (cosmic-text based, supports color emoji)
glyphon = "0.10"

# Markdown parsing
pulldown-cmark = "0.12"

# SVG rendering for controller glyphs
resvg = "0.45"

# PNG encoding for screenshots
png = "0.17"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }
libc = "0.2.179"

# Anthropic SDK via Go FFI
anthropic-ffi = { path = "crates/anthropic-ffi" }

# Environment file loading
dotenvy = "0.15"

# File globbing
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
